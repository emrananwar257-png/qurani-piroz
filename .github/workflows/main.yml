name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Download Raad timing database
        run: |
          mkdir -p public/gapless-timing
          curl -L --fail --retry 3 \
            "https://github.com/Hiwaselah/qari_kurdi_mutasil/releases/download/Raad/raad_al_kurdi.db" \
            -o public/gapless-timing/raad_kurdi.db

      - name: Build
        # Build after bundling the Raad timing DB for deterministic highlighting.
        # Pages deployment trigger.
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
